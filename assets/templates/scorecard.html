    <title>Distributor Scorecard</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="report-container">

        <!-- =========================
             REPORT HEADER
        ========================== -->
        <header class="report-header">

            <!-- Top Header -->
            <div class="top-header">

                <!-- Company Logo -->
                <div class="logo">
                    LOGO
                </div>

                <!-- Company Information -->
                <div class="company-details">
                    <h1>SALESREPORT</h1>

                </div>

                <!-- Financial Year -->
                <div class="financial-year">
                    <p><strong>FY</strong></p>
                    <p>2025-26</p>
                </div>

            </div>

            <!-- Distributor Information -->
            <div class="distributor-details">

                <div class="detail-item">
                    <span class="label">Distributor</span>
                    <span class="value">ABC Traders</span>
                </div>

                <div class="detail-item">
                    <span class="label">Generated</span>
                    <span class="value">10-Jul-2026</span>
                </div>

                <div class="detail-item">
                    <span class="label">City</span>
                    <span class="value">Vapi</span>
                </div>

                <div class="detail-item">
                    <span class="label">State</span>
                    <span class="value">Gujarat</span>
                </div>

            </div>

</div>
